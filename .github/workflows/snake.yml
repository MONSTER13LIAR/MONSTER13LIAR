name: Generate blue snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3d74ff&color_dots=#161b22,#16285c,#1f43a3,#3d74ff,#9fb6ff
            dist/snake-light.svg?palette=github-light&color_snake=#1e5eff&color_dots=#ebedf0,#c7d6ff,#8fb0ff,#4f82ff,#1e5eff

      - name: push to the snake branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
